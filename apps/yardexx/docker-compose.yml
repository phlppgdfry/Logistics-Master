services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yardexx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup_local_env.py first}
      POSTGRES_DB: yardexx_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - yardexx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yardexx -d yardexx_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://yardexx:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/yardexx_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  yardexx_pgdata:
