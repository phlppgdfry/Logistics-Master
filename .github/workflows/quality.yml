name: Quality regressions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TLS verification
        run: python -m unittest discover -s intelligence/logistics-intel/tests -p test_tls.py
      - name: Chart lifecycle
        run: node --test tests/chart-lifecycle.test.cjs
